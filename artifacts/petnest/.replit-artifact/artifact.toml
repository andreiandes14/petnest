kind = "web"
previewPath = "/"
title = "PetNest"
description = "A multi-provider pet care marketplace where pet owners discover grooming, vaccination, and pet supply providers, manage pet profiles, book care, and shop from one place."
version = "1.0.0"
id = "artifacts/petnest"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25419

[services.development]
run = "pnpm --filter @workspace/petnest run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/petnest", "run", "build" ]
serve = "static"
publicDir = "artifacts/petnest/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25419"
BASE_PATH = "/"
